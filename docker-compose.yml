version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rootlearn-postgres
    environment:
      POSTGRES_USER: rootlearn
      POSTGRES_PASSWORD: rootlearn
      POSTGRES_DB: rootlearn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootlearn"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
