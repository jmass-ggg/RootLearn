[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    asyncio: mark test as an async test
    property: mark test as a property-based test
addopts = 
    -v
    --tb=short
    --strict-markers

# Hypothesis settings
hypothesis_profile = default
