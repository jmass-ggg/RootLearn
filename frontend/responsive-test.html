<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootLearn Responsive Layout Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #f4f7fb;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 30px;
            color: #10213d;
        }

        .viewport-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .viewport-btn {
            padding: 10px 20px;
            border: 2px solid #1463ff;
            background: white;
            color: #1463ff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .viewport-btn:hover {
            background: #1463ff;
            color: white;
        }

        .viewport-btn.active {
            background: #1463ff;
            color: white;
        }

        .test-frame-container {
            border: 3px solid #1463ff;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin: 0 auto;
            transition: width 0.3s ease;
        }

        .test-info {
            padding: 15px;
            background: #1463ff;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-frame {
            width: 100%;
            border: none;
            display: block;
            background: white;
            min-height: 800px;
        }

        .checklist {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }

        .checklist h2 {
            margin-bottom: 15px;
            color: #10213d;
        }

        .checklist-item {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-item label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checklist-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .page-selector {
            margin-bottom: 20px;
        }

        .page-selector select {
            padding: 10px 15px;
            border: 2px solid #1463ff;
            border-radius: 8px;
            font-size: 14px;
            min-width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RootLearn Responsive Layout Test</h1>
        
        <div class="page-selector">
            <label for="page-select"><strong>Select Page:</strong></label>
            <select id="page-select">
                <option value="/">Landing Page</option>
                <option value="/new-session">New Session</option>
                <option value="/session/test-session-id?user_id=test-user">Session Page (Diagnosing)</option>
                <option value="/session/test-session-id/tutor?user_id=test-user">Tutor Page</option>
                <option value="/session/test-session-id/teachback?user_id=test-user">Teach-Back Page</option>
            </select>
        </div>

        <div class="viewport-selector">
            <button class="viewport-btn" data-width="375" data-name="Mobile (375px)">📱 Mobile (375px)</button>
            <button class="viewport-btn" data-width="768" data-name="Tablet (768px)">📱 Tablet (768px)</button>
            <button class="viewport-btn" data-width="1024" data-name="Desktop (1024px)">💻 Desktop (1024px)</button>
            <button class="viewport-btn active" data-width="1440" data-name="Desktop (1440px)">🖥️ Desktop (1440px)</button>
            <button class="viewport-btn" data-width="100%" data-name="Full Width">↔️ Full Width</button>
        </div>

        <div class="test-frame-container" id="frame-container">
            <div class="test-info">
                <span id="viewport-info">Viewport: 1440px (Desktop)</span>
                <span id="scroll-info">Check for horizontal scroll</span>
            </div>
            <iframe id="test-frame" class="test-frame" src="http://localhost:3000/"></iframe>
        </div>

        <div class="checklist">
            <h2>Responsive Layout Checklist</h2>
            
            <div class="checklist-item">
                <label>
                    <input type="checkbox" data-check="mobile-no-scroll">
                    <span>No horizontal scrolling on mobile (375px)</span>
                </label>
            </div>
            
            <div class="checklist-item">
                <label>
                    <input type="checkbox" data-check="tablet-no-scroll">
                    <span>No horizontal scrolling on tablet (768px)</span>
                </label>
            </div>
            
            <div class="checklist-item">
                <label>
                    <input type="checkbox" data-check="two-col-collapse">
                    <span>Two-column layouts collapse to single column on mobile</span>
                </label>
            </div>
            
            <div class="checklist-item">
                <label>
                    <input type="checkbox" data-check="header-responsive">
                    <span>Header adapts properly on mobile (truncates topic, collapses buttons)</span>
                </label>
            </div>
            
            <div class="checklist-item">
                <label>
                    <input type="checkbox" data-check="sidebar-mobile">
                    <span>Sidebar becomes hamburger menu on mobile</span>
                </label>
            </div>
            
            <div class="checklist-item">
                <label>
                    <input type="checkbox" data-check="cards-responsive">
                    <span>Cards and content areas resize properly</span>
                </label>
            </div>
            
            <div class="checklist-item">
                <label>
                    <input type="checkbox" data-check="graph-responsive">
                    <span>Knowledge graph doesn't overflow container</span>
                </label>
            </div>
            
            <div class="checklist-item">
                <label>
                    <input type="checkbox" data-check="buttons-touch">
                    <span>Buttons and interactive elements accessible on touch devices</span>
                </label>
            </div>
            
            <div class="checklist-item">
                <label>
                    <input type="checkbox" data-check="text-readable">
                    <span>Text remains readable at all viewport sizes</span>
                </label>
            </div>
            
            <div class="checklist-item">
                <label>
                    <input type="checkbox" data-check="landing-responsive">
                    <span>Landing page hero and sections stack properly on mobile</span>
                </label>
            </div>
        </div>
    </div>

    <script>
        const frameContainer = document.getElementById('frame-container');
        const testFrame = document.getElementById('test-frame');
        const viewportInfo = document.getElementById('viewport-info');
        const pageSelect = document.getElementById('page-select');
        const buttons = document.querySelectorAll('.viewport-btn');

        // Handle viewport button clicks
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const width = button.dataset.width;
                const name = button.dataset.name;
                
                // Update active state
                buttons.forEach(b => b.classList.remove('active'));
                button.classList.add('active');
                
                // Update container width
                if (width === '100%') {
                    frameContainer.style.width = '100%';
                    frameContainer.style.maxWidth = 'none';
                } else {
                    frameContainer.style.width = width + 'px';
                    frameContainer.style.maxWidth = width + 'px';
                }
                
                // Update info
                viewportInfo.textContent = `Viewport: ${name}`;
            });
        });

        // Handle page selection
        pageSelect.addEventListener('change', (e) => {
            testFrame.src = 'http://localhost:3000' + e.target.value;
        });

        // Save checklist state to localStorage
        const checkboxes = document.querySelectorAll('.checklist-item input[type="checkbox"]');
        checkboxes.forEach(checkbox => {
            const key = 'responsive-check-' + checkbox.dataset.check;
            checkbox.checked = localStorage.getItem(key) === 'true';
            
            checkbox.addEventListener('change', () => {
                localStorage.setItem(key, checkbox.checked);
            });
        });

        // Initialize with 1440px
        frameContainer.style.width = '1440px';
        frameContainer.style.maxWidth = '1440px';
    </script>
</body>
</html>
